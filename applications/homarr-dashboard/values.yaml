## Homarr Dashboard - Helm Values
## Chart: https://homarr-labs.github.io/charts/
## Docs:  https://homarr.dev/docs/getting-started/installation/kubernetes

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
image:
  repository: ghcr.io/homarr-labs/homarr
  tag: ""          # Leave empty to follow chart's default (appVersion)
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Replicas
# ---------------------------------------------------------------------------
replicaCount: 1

# ---------------------------------------------------------------------------
# Secret - REQUIRED
# Generate with: openssl rand -hex 32
# Store this in a Kubernetes secret and reference it, or set directly.
# ---------------------------------------------------------------------------
envSecrets:
  dbCredentials:
    existingSecret: "homarr-secret"
    dbEncryptionKey: "SECRET_ENCRYPTION_KEY"

env:
  AUTH_PROVIDERS: "credentials"
  TZ: "Europe/Istanbul"

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 7575

# ---------------------------------------------------------------------------
# Ingress / VirtualService
# Uncomment the ingress block if you use a standard ingress controller.
# ---------------------------------------------------------------------------
virtualService:
  enabled: true
  host: website.krbck.site
  gateway: default/nginx-gateway
  prefix: /api

# ---------------------------------------------------------------------------
# Persistence
# SQLite data + user uploads live under /appdata by default.
# ---------------------------------------------------------------------------
persistence:
  homarrDatabase:
    enabled: true
    name: "homarr-database"
    storageClassName: ""
    accessMode: "ReadWriteOnce"
    size: "1Gi"
    mountPath: "/appdata/db"
  homarrImages:
    enabled: true
    name: "homarr-images"
    storageClassName: ""
    accessMode: "ReadWriteOnce"
    size: "1Gi"
    mountPath: "/images"

# ---------------------------------------------------------------------------
# RBAC
# Enable if you want Homarr to discover Kubernetes services automatically.
# ---------------------------------------------------------------------------
rbac:
  enabled: true

serviceAccount:
  create: true

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ---------------------------------------------------------------------------
# Security Context
# ---------------------------------------------------------------------------
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------
# Probes
# ---------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /
    port: 7575
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 7575
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 3

# ---------------------------------------------------------------------------
# Autoscaling (disabled for homelab single-node)
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false

# ---------------------------------------------------------------------------
# Node scheduling
# ---------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}
